# Perfil para Railway (hospedagem gerenciada). O Dockerfile usa $PORT quando
# a plataforma o fornece. Mantenha apenas UMA réplica, pois os robôs executam
# tarefas em segundo plano dentro deste único serviço.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
