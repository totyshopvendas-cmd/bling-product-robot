services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - totyshop_mongo:/data/db

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-bling_robot}
      TZ: America/Sao_Paulo
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    volumes:
      # chaves salvas pelo painel (Bling, IA), planilhas exportadas e tabela de preços
      - totyshop_secrets:/app/backend/.secrets
      - totyshop_exports:/app/backend/exports
      - totyshop_data:/app/data

volumes:
  totyshop_mongo:
  totyshop_secrets:
  totyshop_exports:
  totyshop_data:
