services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - totyshop_mongo:/data/db

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    # Escuta apenas no próprio servidor. Na publicação online o Caddy recebe
    # HTTPS nas portas 80/443 e encaminha para a rede interna do Compose.
    # Para mudar este bind em um uso local, defina TOTYSHOP_APP_BIND.
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-bling_robot}
      TZ: America/Sao_Paulo
    ports:
      - "${TOTYSHOP_APP_BIND:-127.0.0.1}:8000:8000"
    depends_on:
      - mongo
    volumes:
      # chaves salvas pelo painel (Bling, IA), planilhas exportadas e tabela de preços
      - totyshop_secrets:/app/backend/.secrets
      - totyshop_exports:/app/backend/exports
      - totyshop_data:/app/data

volumes:
  totyshop_mongo:
  totyshop_secrets:
  totyshop_exports:
  totyshop_data:
