services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - totyshop_mongo:/data/db

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["local-ai"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - totyshop_ollama:/root/.ollama

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-bling_robot}
      TZ: America/Sao_Paulo
      TOTYSHOP_CORE_ONLY: "1"
      LOCAL_DB_FLUSH_INTERVAL: "30"
    ports:
      # Acesso local apenas por padrão; não expõe o painel diretamente à rede.
      - "127.0.0.1:8000:8000"
    depends_on:
      - mongo
    volumes:
      # chaves salvas pelo painel (Bling, IA), planilhas exportadas e tabela de preços
      - totyshop_secrets:/app/backend/.secrets
      - totyshop_exports:/app/backend/exports
      - totyshop_data:/app/data

volumes:
  totyshop_mongo:
  totyshop_secrets:
  totyshop_exports:
  totyshop_data:
  totyshop_ollama:
